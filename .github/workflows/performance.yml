name: Production performance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-performance
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Wait for this exact clean production deployment
        run: node scripts/production-check.mjs --commit "$GITHUB_SHA" --wait-seconds 900
      - name: Three mobile runs and one desktop run per page
        run: node scripts/lighthouse-audit.mjs
        env:
          AUDIT_COMMIT: ${{ github.sha }}
      - name: Preserve every measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: ignore
