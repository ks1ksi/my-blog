name: Quality

on:
  pull_request:
  push:
    branches: [main, "quality/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Clean install with strict peer dependency resolution
        run: npm ci
      - name: Format, unit, tag, type, build, and generated-output checks
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop and mobile browser smoke and accessibility checks
        run: npm run test:browser
      - name: Capture actual header pixels across touch navigation
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/header-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/header-render-audit.mjs
      - name: Preserve rendered header evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-render-evidence
          path: render-audit/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
