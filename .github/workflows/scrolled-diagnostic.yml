name: Scrolled history diagnostic
on:
  push:
    branches: [diagnostic/scrolled-history]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/browser/scrolled-diagnostic.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://ks1ksi.io
